services:
  postgres:
    image: postgres:16-alpine
    container_name: food_delivery_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: food
      POSTGRES_PASSWORD: food_secret
      POSTGRES_DB: food_delivery
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U food -d food_delivery"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: food_delivery_api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Trong mạng Docker, backend gọi DB bằng tên service "postgres", cổng 5432
      DATABASE_URL: postgresql://food:food_secret@postgres:5432/food_delivery?schema=public
      NODE_ENV: production
    ports:
      - "3000:3000"
    volumes:
      # Giữ avatar người dùng upload khi build lại container
      - ./backend/public/uploads:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:

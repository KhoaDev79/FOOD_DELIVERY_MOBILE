services:
  postgres:
    image: postgres:16-alpine
    container_name: food_delivery_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: food
      POSTGRES_PASSWORD: food_secret
      POSTGRES_DB: food_delivery
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U food -d food_delivery"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:

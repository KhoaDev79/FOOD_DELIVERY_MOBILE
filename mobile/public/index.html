<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover: khi mở từ màn hình chính iPhone, nội dung tràn tới tai thỏ; app tự chừa vùng an toàn -->
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>ZomZom – Giao đồ ăn</title>
    <meta name="description" content="ZomZom – đặt món ngon quanh bạn, giao tận nơi." />
    <meta name="theme-color" content="#0E4A55" />

    <!-- "Thêm vào Màn hình chính" trên iPhone: chạy toàn màn hình như app, có biểu tượng và tên riêng -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ZomZom" />
    <!-- Thanh trạng thái ĐẶC màu (theo theme-color ở trên), không dùng "black-translucent":
         kiểu trong suốt làm iPhone tính thiếu chiều cao app (hở dải ở đáy, thanh tab bị đẩy lên)
         và phủ lớp mờ trắng lên header nằm dưới giờ/pin. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      /* 100dvh = chiều cao vùng hiển thị thật (Safari có thanh công cụ thì tự trừ ra). */
      html,
      body {
        height: 100%;
        height: 100vh;
        height: 100dvh;
        /* iOS lấy màu nền trang để tô vùng thanh trạng thái: dùng xanh đậm của header cho liền màu.
           Khung app đã phủ kín màn hình nên màu này không lộ ra ở đáy. */
        background-color: #0E4A55;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        /* iOS: không cho kéo nảy cả trang / tự phóng to chữ khi xoay máy */
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        height: 100vh;
        height: 100dvh;
        flex: 1;
        box-sizing: border-box;
      }
      /* iPhone: kéo quá đầu/cuối danh sách làm cả vùng cuộn "nảy" và lộ nền trắng phía trên header xanh.
         Tắt hiệu ứng nảy theo chiều dọc cho mọi vùng cuộn của app (cuộn bình thường không ảnh hưởng;
         trên web cũng không có kéo-để-làm-mới nên không mất tính năng). */
      #root div {
        overscroll-behavior-y: none;
      }
      /* Chỉ khi mở từ "Màn hình chính": iOS phủ một dải mờ ngay dưới thanh trạng thái lên nội dung.
         Đẩy app xuống 10px; phần hở cùng màu xanh với thanh trạng thái nên trông như thanh cao hơn một chút. */
      @media (display-mode: standalone) {
        #root {
          padding-top: 10px;
        }
      }
    </style>
  </head>

  <body>
    <noscript>Vui lòng bật JavaScript để dùng ZomZom.</noscript>
    <div id="root"></div>
  </body>
</html>
